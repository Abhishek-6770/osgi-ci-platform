name: Setup Eclipse PDE Build
description: Install Java and download the Eclipse SDK containing PDE Build
inputs:
  eclipse-sdk-url:
    description: Linux Eclipse SDK archive URL to use as the PDE build engine
    required: false
    default: https://download.eclipse.org/eclipse/downloads/drops4/R-4.30-202312010110/eclipse-SDK-4.30-linux-gtk-x86_64.tar.gz
outputs:
  eclipse-home:
    description: Absolute path to the extracted Eclipse SDK
    value: ${{ steps.install.outputs.eclipse_home }}
runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: Install Graphviz
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes graphviz

    - name: Download and validate Eclipse PDE Build
      id: install
      shell: bash
      env:
        ECLIPSE_SDK_URL: ${{ inputs.eclipse-sdk-url }}
      run: |
        set -euo pipefail
        cache_root="$HOME/.cache/osgi-pde/eclipse-SDK-4.30"
        archive="$RUNNER_TEMP/eclipse-sdk.tar.gz"
        install_root="$cache_root"
        eclipse_home="$install_root/eclipse"
        mkdir -p "$install_root"

        if [[ ! -d "$eclipse_home/plugins" ]]; then
          echo "Downloading Eclipse SDK for headless PDE Build..."
          curl --fail --location --retry 3 --retry-delay 2 \
            "$ECLIPSE_SDK_URL" --output "$archive"
          rm -rf "$install_root/eclipse"
          tar -xzf "$archive" -C "$install_root"
        else
          echo "Reusing cached Eclipse SDK at $eclipse_home"
        fi

        if [[ ! -d "$eclipse_home/plugins" ]]; then
          echo "Eclipse SDK was extracted, but '$eclipse_home/plugins' was not found." >&2
          exit 1
        fi
        find "$eclipse_home/plugins" -maxdepth 1 -type d -name 'org.eclipse.pde.build_*' | grep -q . || {
          echo "The selected Eclipse SDK does not contain org.eclipse.pde.build." >&2
          exit 1
        }
        find "$eclipse_home/plugins" -maxdepth 1 -type f -name 'org.eclipse.equinox.launcher_*.jar' | grep -q . || {
          echo "Could not find the Equinox launcher JAR in the Eclipse SDK." >&2
          exit 1
        }

        echo "eclipse_home=$eclipse_home" >> "$GITHUB_OUTPUT"
        echo "Eclipse PDE Build is available at $eclipse_home"
