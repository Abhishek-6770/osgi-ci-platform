name: Reusable OSGi Security Gates

on:
  workflow_call:
    inputs:
      container_image:
        description: Optional public container image reference to scan with Trivy
        type: string
        required: false
        default: ""
      runner:
        description: JSON array of runner labels
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      GITLEAKS_LICENSE:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-detection:
    name: Secret detection (Gitleaks)
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    name: SCA gate (dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container-vulnerability-scan:
    name: Optional container vulnerability scan (Trivy)
    if: inputs.container_image != ''
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Scan configured image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.container_image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
